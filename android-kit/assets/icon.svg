<?xml version="1.0" encoding="UTF-8"?>
<!-- Beam app icon. 1024x1024 source. Design: cyan-to-purple gradient
     background with a bold "B" letterform in white. Adaptive-icon safe
     zone respected (content inside 66% center circle). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00e4ff"/>
      <stop offset="1" stop-color="#7c5cff"/>
    </linearGradient>
    <linearGradient id="letter" x1="0" y1="200" x2="0" y2="850" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f0f4ff"/>
    </linearGradient>
  </defs>
  <!-- Full-bleed background — required for Android adaptive icons. -->
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <!-- The "B" glyph rendered as paths so it renders identically at every
       density (no font dependency). Centered in the 66% safe zone
       (roughly x:170..854, y:170..854). -->
  <path fill="url(#letter)"
        d="M 340 260
           L 340 764
           L 588 764
           C 690 764 748 706 748 620
           C 748 560 712 512 664 494
           C 704 476 730 434 730 384
           C 730 306 674 260 580 260
           Z
           M 428 342
           L 570 342
           C 618 342 646 366 646 402
           C 646 440 618 466 570 466
           L 428 466
           Z
           M 428 542
           L 588 542
           C 640 542 668 570 668 610
           C 668 654 640 682 588 682
           L 428 682
           Z"/>
</svg>
