<?xml version="1.0" encoding="UTF-8"?>
<!-- Play Store feature graphic (1024x500). Shown at the top of the app's
     listing page. Keep centered content in the middle 924x400 safe zone
     because Play may crop the edges on some devices. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 500" width="1024" height="500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1024" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b0b12"/>
      <stop offset="1" stop-color="#151528"/>
    </linearGradient>
    <linearGradient id="bBg" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00e4ff"/>
      <stop offset="1" stop-color="#7c5cff"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="500" fill="url(#bg)"/>

  <!-- App icon on the left side of the graphic -->
  <g transform="translate(120, 150)">
    <rect x="0" y="0" width="200" height="200" rx="44" ry="44" fill="url(#bBg)"/>
    <path fill="#ffffff"
          d="M 64 52
             L 64 148
             L 116 148
             C 138 148 150 137 150 121
             C 150 109 142 100 132 96
             C 141 92 147 84 147 74
             C 147 59 135 52 118 52
             Z
             M 82 68
             L 114 68
             C 124 68 130 72 130 79
             C 130 87 124 92 114 92
             L 82 92
             Z
             M 82 106
             L 118 106
             C 128 106 133 111 133 119
             C 133 128 128 132 118 132
             L 82 132
             Z"/>
  </g>

  <!-- Wordmark + tagline on the right -->
  <g transform="translate(400, 200)" font-family="Segoe UI, Helvetica, Arial, sans-serif" fill="#ffffff">
    <text x="0" y="0" font-size="88" font-weight="800" letter-spacing="-2">Beam</text>
    <text x="0" y="52" font-size="22" font-weight="500" fill="#a0a8c0">A private mailbox for people</text>
    <text x="0" y="82" font-size="22" font-weight="500" fill="#a0a8c0">who cannot afford leaks.</text>
    <text x="0" y="128" font-size="15" font-weight="600" fill="#00e4ff" letter-spacing="3">END-TO-END ENCRYPTED · NO TRACKERS</text>
  </g>
</svg>
